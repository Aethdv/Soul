[package]
name = "soul"
version = "0.6.1"
license = "AGPL-3.0-or-later"
readme = "README.md"
authors = ["Aethdv (aethrdv@gmail.com)"]
description = "A modern alpha-beta chess engine, featuring Hand-Crafted Evaluation with SIMD."
repository = "https://github.com/Aethdv/Soul"
keywords = [
    "chess",
    "chess-engine",
    "treesearch",
    "alpha-beta",
    "negamax",
    "hce",
]
categories = ["games", "simulation"]
edition = "2024"
rust-version = "1.97.0"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[workspace]
members = ["evaltuner"]

[lib]
name = "soul"
path = "src/lib.rs"

[[bin]]
name = "soul"
path = "src/main.rs"

[dependencies]
paste = "1.0.15"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0.18"
fastrand = { version = "2.4.1", optional = true }
ctrlc = { version = "3.5.2", optional = true }
zerocopy = { version = "0.8.52", default-features = false, features = ["derive", "simd"], optional = true }
atomic-wait = "1.1"

[features]
# Reading and writing .vf and EPD, and the cached gradient path evaltune trains on.
dataset = ["dep:serde", "dep:serde_json", "dep:zerocopy"]
# Self-play generation and its opening books, which write viriformat.
datagen = ["dataset", "dep:ctrlc", "dep:fastrand"]
# Measurement rigs: byteboard, the store pricing, and the nps speedtest.
rigs = []
corrstats = []
mvpstats = []
# Builds without XorBoard, so the store can be priced against its own absence.
nostore = []
# Builds without correction history, so the tables can be priced against their absence.
nocorr = []

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
debug = false
split-debuginfo = "off"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 3
debug = true
panic = "abort"
split-debuginfo = "unpacked"

[profile.quick]
inherits = "dev"
opt-level = 1
debug = false

[profile.test]
opt-level = 1
