[package]
name = "evaltuner"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "evaltune"
path = "src/main.rs"

[dependencies]
soul = { path = "../", features = ["dataset"] }
clap = { version = "4.6.1", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
fastrand = "2.4.1"
rayon = "1.12.0"
zerocopy = { version = "0.8.52", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zstd = { version = "0.13.3", default-features = false }
toml = "1.1.2"
paste = "1.0.15"
thiserror = "2.0.18"
ctrlc = "3.5.2"

[features]
default = []
