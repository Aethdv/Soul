name: CI

on:
  push:
    branches: [ "soul" ]
  pull_request:
    branches: [ "soul" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=x86-64-v3"
  RUSTDOCFLAGS: "-C target-cpu=x86-64-v3"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-10
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-10
          components: clippy
      - name: Run clippy
        run: make clippy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-10
      - name: Run tests
        run: make test

  bench:
    name: Bench Signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-10
      - name: Verify Bench Signature
        run: |
          make v3
          benchref=$(git show -s --format=%B HEAD | sed '1!G;h;$!d' | grep -m 1 -o -i 'bench[: ]\+[1-9][0-9]*\b' | sed 's/[^0-9]//g')
          if [[ -n "$benchref" ]]; then
            echo "Reference bench: $benchref"
          else
            echo "ERROR: No reference bench found in commit message. Please add 'bench: XXXXXX' to the end of the commit message."
            exit 1
          fi
          
          obtained=$(./soul bench 2>&1 | tail -n 1 | awk '{print $2}')
          echo "Obtained bench: $obtained"
          
          if [ "$benchref" != "$obtained" ]; then
            echo "ERROR: Signature mismatch! Reference: $benchref, Obtained: $obtained."
            exit 1
          fi
